# BEGIN darsjadval
# /api/, /admin/ → Django (Passenger); /static/ → Django admin fayllari;
# qolgan hamma manzil (/, /s/..., /tablet/...) → Angular index.html
DirectoryIndex index.html
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/(api|admin|static)(/|$)
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{REQUEST_FILENAME} !-f
RewriteRule ^ index.html [L]

# Xizmat fayllarini tashqariga bermaslik
RedirectMatch 404 ^/(app|tmp|__pycache__)(/|$)
<FilesMatch "^(passenger_wsgi\.pyc?|\.user\.ini|\.htaccess)$">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</IfModule>
# END darsjadval
