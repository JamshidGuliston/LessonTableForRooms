# /etc/nginx/sites-available/darsjadval  →  ln -s ../sites-available/darsjadval /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name jadval.example.uz 192.168.1.10;

    # Angular (admin panel + /tablet/<token>)
    root /srv/darsjadval/frontend/dist/frontend/browser;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin CSS/JS (collectstatic)
    location ^~ /static/ {
        alias /srv/darsjadval/backend/staticfiles/;
        expires 30d;
    }

    # Angular fayllari (nomida hash bor) — uzoq keshlanadi, index.html — yo'q
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
